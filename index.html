<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evaluator-Phone</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="arts/phoneIcon.png">
    <link rel="apple-touch-icon" href="arts/phoneIcon.png">
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #090d16;
            --bg-card: rgba(19, 27, 46, 0.75);
            --bg-card-hover: rgba(30, 41, 69, 0.85);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --accent-secondary: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-lg: 18px;
            --radius-md: 12px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
        }

        header {
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 13, 22, 0.85);
        }

        .navbar {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-main);
            text-decoration: none;
            white-space: nowrap;
        }

        .logo img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .nav-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }

        .search-bar {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .search-bar input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 0.65rem 1rem 0.65rem 2.6rem;
            border-radius: var(--radius-md);
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .search-bar input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px var(--accent-glow);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-bar i {
            position: absolute;
            left: 0.9rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
            width: 100%;
            flex: 1;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
        }

        .evaluator-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .form-title span {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control {
            background: rgba(9, 13, 22, 0.7);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .range-slider {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .range-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .range-slider input[type="range"] {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            accent-color: var(--accent-primary);
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            padding: 0.85rem;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.5rem;
            min-height: 48px;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-toggle-filters {
            display: none;
            width: 100%;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .results-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.25rem;
        }

        .device-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            position: relative;
        }

        .device-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.4);
            background: var(--bg-card-hover);
        }

        .device-image-wrap {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .device-image-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: var(--transition);
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        .device-card:hover .device-image-wrap img {
            transform: scale(1.05);
        }

        .device-body {
            padding: 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .device-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .device-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }

        .score-badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent-primary);
            color: #818cf8;
            font-weight: 800;
            font-size: 0.9rem;
            padding: 0.35rem 0.65rem;
            border-radius: var(--radius-md);
            box-shadow: 0 0 12px var(--accent-glow);
            white-space: nowrap;
        }

        .specs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            margin: 0.75rem 0;
            font-size: 0.8rem;
            flex: 1;
        }

        .specs-list li {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            padding-bottom: 0.3rem;
            gap: 0.5rem;
        }

        .specs-list li span {
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
        }

        .device-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            gap: 0.5rem;
        }

        .price-tag {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent-secondary);
        }

        .btn-link {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            transition: var(--transition);
            min-height: 40px;
        }

        .btn-compare {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-compare.active {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--accent-primary);
            color: var(--text-main);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .comparison-bar {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(200%);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            padding: 0.85rem 1.25rem;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 200;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: calc(100% - 2rem);
            max-width: 600px;
            justify-content: space-between;
        }

        .comparison-bar.show {
            transform: translateX(-50%) translateY(0);
        }

        .comparison-items {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .comparison-chip {
            background: rgba(255, 255, 255, 0.08);
            padding: 0.35rem 0.65rem;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .comparison-chip i {
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 1rem;
        }

        .compare-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        .compare-table th, .compare-table td {
            padding: 0.85rem;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
            font-size: 0.85rem;
        }

        .compare-table th {
            color: var(--text-muted);
            font-weight: 600;
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .btn-toggle-filters {
                display: flex;
            }

            .aside-card {
                display: none;
            }

            .aside-card.open {
                display: block;
            }
        }

        @media (max-width: 640px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
            }

            .nav-actions {
                max-width: 100%;
            }

            .comparison-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }

            .comparison-bar .btn-primary {
                margin-top: 0;
            }

            .device-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="#" class="logo">
                <img src="arts/phoneIcon.png" alt="Evaluator-Phone Icon">
                <span>Evaluator-Phone</span>
            </a>
            <div class="nav-actions">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="deviceSearch" data-i18n-placeholder="searchPlaceholder">
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <button class="btn-toggle-filters" id="toggleFiltersBtn">
            <i class="fa-solid fa-sliders"></i> <span data-i18n="toggleFilters">Toggle Filters</span>
        </button>

        <div class="dashboard-grid">
            <aside class="card aside-card" id="asideFilters">
                <form class="evaluator-form" id="evaluationForm">
                    <div class="form-title">
                        <span><i class="fa-solid fa-sliders"></i> <span data-i18n="evalWeights">Evaluation Weights</span></span>
                        <span class="status-badge"><i class="fa-solid fa-circle-check"></i> <span data-i18n="liveData">Live Data</span></span>
                    </div>

                    <div class="form-group">
                        <label for="brand" data-i18n="brand">Brand</label>
                        <select id="brand" class="form-control">
                            <option value="all" data-i18n="allBrands">All Brands</option>
                            <option value="apple">Apple</option>
                            <option value="samsung">Samsung</option>
                            <option value="google">Google</option>
                            <option value="oneplus">OnePlus</option>
                            <option value="xiaomi">Xiaomi</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="price" data-i18n="maxBudget">Max Budget</label>
                        <input type="number" id="price" class="form-control" placeholder="10000" value="10000">
                    </div>

                    <div class="range-slider">
                        <div class="range-header">
                            <span data-i18n="cameraPriority">Camera Priority</span>
                            <span id="cameraVal">40%</span>
                        </div>
                        <input type="range" id="camera" min="0" max="100" value="40">
                    </div>

                    <div class="range-slider">
                        <div class="range-header">
                            <span data-i18n="perfPriority">Performance Priority</span>
                            <span id="perfVal">35%</span>
                        </div>
                        <input type="range" id="performance" min="0" max="100" value="35">
                    </div>

                    <div class="range-slider">
                        <div class="range-header">
                            <span data-i18n="batteryPriority">Battery & Charging</span>
                            <span id="batteryVal">25%</span>
                        </div>
                        <input type="range" id="battery" min="0" max="100" value="25">
                    </div>

                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-calculator"></i> <span data-i18n="recalculate">Recalculate Scores</span>
                    </button>
                </form>
            </aside>

            <section class="results-container">
                <div class="results-header">
                    <h2 class="results-title" data-i18n="evaluatedDevices">Evaluated Smartphones</h2>
                    <span id="resultCount" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">...</span>
                </div>

                <div class="device-grid" id="deviceGrid">
                </div>
            </section>
        </div>
    </main>

    <div class="comparison-bar" id="comparisonBar">
        <div class="comparison-items" id="comparisonItems"></div>
        <button class="btn-primary" id="openCompareModal" data-i18n="compareSelected">Compare Selected</button>
    </div>

    <div class="modal-overlay" id="compareModal">
        <div class="modal-content">
            <button class="modal-close" id="closeCompareModal"><i class="fa-solid fa-xmark"></i></button>
            <h2 style="font-size: 1.3rem; font-weight: 700;" data-i18n="comparisonTitle">Side-by-Side Comparison</h2>
            <div class="table-responsive" id="modalTableContainer"></div>
        </div>
    </div>

    <script>
        const TRANSLATIONS = {
            'en': {
                siteTitle: "Evaluator-Phone - Advanced Mobile Device Evaluator",
                searchPlaceholder: "Search device or chipset...",
                toggleFilters: "Toggle Filters",
                evalWeights: "Evaluation Weights",
                liveData: "Live Data",
                brand: "Brand",
                allBrands: "All Brands",
                maxBudget: "Max Budget",
                cameraPriority: "Camera Priority",
                perfPriority: "Performance Priority",
                batteryPriority: "Battery & Charging",
                recalculate: "Recalculate Scores",
                evaluatedDevices: "Evaluated Smartphones",
                showingCount: "Showing {count} evaluated items",
                compareSelected: "Compare Selected",
                comparisonTitle: "Side-by-Side Comparison",
                scoreText: "Score",
                processor: "Processor",
                display: "Display",
                camera: "Camera",
                battery: "Battery",
                ram: "RAM",
                price: "Price",
                analyze: "Analyze",
                feature: "Feature",
                limitAlert: "You can compare up to 3 devices at once.",
                currency: "$"
            },
            'pt': {
                siteTitle: "Evaluator-Phone - Avaliador Avançado de Celulares e Smartphones",
                searchPlaceholder: "Buscar celular ou chip...",
                toggleFilters: "Mostrar / Ocultar Filtros",
                evalWeights: "Pesos de Avaliação",
                liveData: "Dados Ativos",
                brand: "Marca",
                allBrands: "Todas as marcas",
                maxBudget: "Orçamento Máximo",
                cameraPriority: "Prioridade de Câmera",
                perfPriority: "Prioridade de Desempenho",
                batteryPriority: "Bateria e Carga",
                recalculate: "Recalcular Notas",
                evaluatedDevices: "Smartphones Avaliados",
                showingCount: "Exibindo {count} itens avaliados",
                compareSelected: "Comparar Selecionados",
                comparisonTitle: "Comparativo Lado a Lado",
                scoreText: "Nota",
                processor: "Processador",
                display: "Tela",
                camera: "Câmera",
                battery: "Bateria",
                ram: "RAM",
                price: "Preço",
                analyze: "Analisar",
                feature: "Recurso",
                limitAlert: "Você pode comparar até 3 dispositivos simultaneamente.",
                currency: "R$"
            },
            'es': {
                siteTitle: "Evaluator-Phone - Evaluador Avanzado de Teléfonos",
                searchPlaceholder: "Buscar teléfono o procesador...",
                toggleFilters: "Mostrar / Ocultar Filtros",
                evalWeights: "Pesos de Evaluación",
                liveData: "Datos En Vivo",
                brand: "Marca",
                allBrands: "Todas las marcas",
                maxBudget: "Presupuesto Máximo",
                cameraPriority: "Prioridad de Cámara",
                perfPriority: "Prioridad de Rendimiento",
                batteryPriority: "Batería y Carga",
                recalculate: "Recalcular Notas",
                evaluatedDevices: "Teléfonos Evaluados",
                showingCount: "Mostrando {count} elementos evaluados",
                compareSelected: "Comparar Seleccionados",
                comparisonTitle: "Comparativa Lado a Lado",
                scoreText: "Nota",
                processor: "Procesador",
                display: "Pantalla",
                camera: "Cámara",
                battery: "Batería",
                ram: "RAM",
                price: "Precio",
                analyze: "Analizar",
                feature: "Característica",
                limitAlert: "Puedes comparar hasta 3 dispositivos simultáneamente.",
                currency: "$"
            }
        };

        function getSystemLanguage() {
            const userLang = navigator.language || navigator.userLanguage || 'en';
            const langCode = userLang.toLowerCase().split('-')[0];
            return TRANSLATIONS[langCode] ? langCode : 'en';
        }

        const currentLang = getSystemLanguage();
        const t = TRANSLATIONS[currentLang];

        function applyI18n() {
            document.documentElement.lang = currentLang;
            document.title = t.siteTitle;

            document.querySelectorAll('[data-i18n]').forEach(elem => {
                const key = elem.getAttribute('data-i18n');
                if (t[key]) elem.textContent = t[key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(elem => {
                const key = elem.getAttribute('data-i18n-placeholder');
                if (t[key]) elem.placeholder = t[key];
            });
        }

        const API_DEVICES = [
            {
                id: "samsung-s25-ultra",
                name: "Galaxy S25 Ultra",
                brand: "samsung",
                prices: { en: 1299, pt: 9999, es: 1299 },
                image: "arts/phoneIcon.png",
                specs: {
                    processor: "Snapdragon 8 Elite",
                    display: '6.8" Dynamic AMOLED 2X 120Hz',
                    camera: "200MP + 50MP + 50MP + 10MP",
                    battery: "5000 mAh (45W)",
                    ram: "12GB / 16GB"
                },
                rawScores: { camera: 98, performance: 99, battery: 92 }
            },
            {
                id: "iphone-16-pro-max",
                name: "iPhone 16 Pro Max",
                brand: "apple",
                prices: { en: 1199, pt: 11499, es: 1199 },
                image: "arts/phoneIcon.png",
                specs: {
                    processor: "Apple A18 Pro",
                    display: '6.9" Super Retina XDR OLED',
                    camera: "48MP + 48MP + 12MP 5x",
                    battery: "4685 mAh (45W)",
                    ram: "8GB"
                },
                rawScores: { camera: 97, performance: 98, battery: 96 }
            },
            {
                id: "pixel-9-pro",
                name: "Pixel 9 Pro XL",
                brand: "google",
                prices: { en: 1099, pt: 7800, es: 1099 },
                image: "arts/phoneIcon.png",
                specs: {
                    processor: "Google Tensor G4",
                    display: '6.8" LTPO OLED 120Hz',
                    camera: "50MP + 48MP + 48MP 5x",
                    battery: "5060 mAh (37W)",
                    ram: "16GB"
                },
                rawScores: { camera: 99, performance: 88, battery: 90 }
            },
            {
                id: "oneplus-13",
                name: "OnePlus 13",
                brand: "oneplus",
                prices: { en: 899, pt: 6400, es: 899 },
                image: "arts/phoneIcon.png",
                specs: {
                    processor: "Snapdragon 8 Elite",
                    display: '6.82" 2K AMOLED 120Hz',
                    camera: "50MP + 50MP + 50MP Hasselblad",
                    battery: "6000 mAh (100W)",
                    ram: "12GB / 16GB / 24GB"
                },
                rawScores: { camera: 92, performance: 99, battery: 100 }
            },
            {
                id: "xiaomi-14-ultra",
                name: "Xiaomi 14 Ultra",
                brand: "xiaomi",
                prices: { en: 1299, pt: 8999, es: 1299 },
                image: "arts/phoneIcon.png",
                specs: {
                    processor: "Snapdragon 8 Gen 3",
                    display: '6.73" LTPO AMOLED 120Hz',
                    camera: "50MP Leica Quad",
                    battery: "5000 mAh (90W)",
                    ram: "16GB"
                },
                rawScores: { camera: 99, performance: 95, battery: 91 }
            }
        ];

        let selectedForComparison = [];

        const updateSliderVal = (id, targetId) => {
            const input = document.getElementById(id);
            const target = document.getElementById(targetId);
            input.addEventListener('input', (e) => {
                target.textContent = `${e.target.value}%`;
            });
        };

        updateSliderVal('camera', 'cameraVal');
        updateSliderVal('performance', 'perfVal');
        updateSliderVal('battery', 'batteryVal');

        function formatCurrency(val) {
            if (currentLang === 'pt') {
                return `R$ ${val.toLocaleString('pt-BR')}`;
            }
            return `$${val.toLocaleString('en-US')}`;
        }

        function calculateIndex(device, weights) {
            const totalWeight = weights.camera + weights.performance + weights.battery;
            if (totalWeight === 0) return 0;

            const weightedScore = 
                (device.rawScores.camera * weights.camera) +
                (device.rawScores.performance * weights.performance) +
                (device.rawScores.battery * weights.battery);

            const score = (weightedScore / totalWeight) / 10;
            return score.toFixed(1);
        }

        function toggleCompare(deviceId) {
            if (selectedForComparison.includes(deviceId)) {
                selectedForComparison = selectedForComparison.filter(id => id !== deviceId);
            } else {
                if (selectedForComparison.length >= 3) {
                    alert(t.limitAlert);
                    return;
                }
                selectedForComparison.push(deviceId);
            }
            updateComparisonBar();
            renderDevices();
        }

        function updateComparisonBar() {
            const bar = document.getElementById('comparisonBar');
            const container = document.getElementById('comparisonItems');

            if (selectedForComparison.length === 0) {
                bar.classList.remove('show');
                return;
            }

            bar.classList.add('show');
            container.innerHTML = '';

            selectedForComparison.forEach(id => {
                const device = API_DEVICES.find(d => d.id === id);
                const chip = document.createElement('div');
                chip.className = 'comparison-chip';
                chip.innerHTML = `
                    <span>${device.name}</span>
                    <i class="fa-solid fa-xmark" onclick="toggleCompare('${device.id}')"></i>
                `;
                container.appendChild(chip);
            });
        }

        function renderDevices() {
            const brandFilter = document.getElementById('brand').value;
            const maxPrice = parseFloat(document.getElementById('price').value) || Infinity;
            const searchQuery = document.getElementById('deviceSearch').value.toLowerCase();

            const weights = {
                camera: parseInt(document.getElementById('camera').value),
                performance: parseInt(document.getElementById('performance').value),
                battery: parseInt(document.getElementById('battery').value)
            };

            const filteredDevices = API_DEVICES.filter(device => {
                const price = device.prices[currentLang] || device.prices['en'];
                const matchesBrand = brandFilter === 'all' || device.brand === brandFilter;
                const matchesPrice = price <= maxPrice;
                const matchesSearch = device.name.toLowerCase().includes(searchQuery) || device.specs.processor.toLowerCase().includes(searchQuery);
                return matchesBrand && matchesPrice && matchesSearch;
            });

            const evaluatedDevices = filteredDevices.map(device => ({
                ...device,
                currentPrice: device.prices[currentLang] || device.prices['en'],
                calculatedIndex: calculateIndex(device, weights)
            })).sort((a, b) => b.calculatedIndex - a.calculatedIndex);

            const grid = document.getElementById('deviceGrid');
            const resultCount = document.getElementById('resultCount');
            
            resultCount.textContent = t.showingCount.replace('{count}', evaluatedDevices.length);
            grid.innerHTML = '';

            evaluatedDevices.forEach(device => {
                const isCompared = selectedForComparison.includes(device.id);
                const card = document.createElement('div');
                card.className = 'device-card';
                card.innerHTML = `
                    <div class="device-image-wrap">
                        <img src="${device.image}" alt="${device.name}" loading="lazy">
                    </div>
                    <div class="device-body">
                        <div class="device-header">
                            <div class="device-info">
                                <h3>${device.name}</h3>
                                <p>${device.brand.toUpperCase()}</p>
                            </div>
                            <div class="score-badge">${t.scoreText} ${device.calculatedIndex}</div>
                        </div>
                        <ul class="specs-list">
                            <li>${t.processor} <span>${device.specs.processor}</span></li>
                            <li>${t.display} <span>${device.specs.display}</span></li>
                            <li>${t.camera} <span>${device.specs.camera}</span></li>
                            <li>${t.battery} <span>${device.specs.battery}</span></li>
                            <li>${t.ram} <span>${device.specs.ram}</span></li>
                        </ul>
                        <div class="device-footer">
                            <span class="price-tag">${formatCurrency(device.currentPrice)}</span>
                            <div style="display: flex; gap: 0.5rem;">
                                <button class="btn-compare ${isCompared ? 'active' : ''}" onclick="toggleCompare('${device.id}')" aria-label="Compare">
                                    <i class="fa-solid fa-layer-group"></i>
                                </button>
                                <button class="btn-link">${t.analyze} <i class="fa-solid fa-arrow-right"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('openCompareModal').addEventListener('click', () => {
            const modal = document.getElementById('compareModal');
            const container = document.getElementById('modalTableContainer');

            const selectedDevices = API_DEVICES.filter(d => selectedForComparison.includes(d.id));

            let tableHTML = `
                <table class="compare-table">
                    <thead>
                        <tr>
                            <th>${t.feature}</th>
                            ${selectedDevices.map(d => `<th>${d.name}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>${t.price}</td>
                            ${selectedDevices.map(d => `<td style="color: var(--accent-secondary); font-weight: 700;">${formatCurrency(d.prices[currentLang] || d.prices['en'])}</td>`).join('')}
                        </tr>
                        <tr>
                            <td>${t.processor}</td>
                            ${selectedDevices.map(d => `<td>${d.specs.processor}</td>`).join('')}
                        </tr>
                        <tr>
                            <td>${t.display}</td>
                            ${selectedDevices.map(d => `<td>${d.specs.display}</td>`).join('')}
                        </tr>
                        <tr>
                            <td>${t.camera}</td>
                            ${selectedDevices.map(d => `<td>${d.specs.camera}</td>`).join('')}
                        </tr>
                        <tr>
                            <td>${t.battery}</td>
                            ${selectedDevices.map(d => `<td>${d.specs.battery}</td>`).join('')}
                        </tr>
                        <tr>
                            <td>${t.ram}</td>
                            ${selectedDevices.map(d => `<td>${d.specs.ram}</td>`).join('')}
                        </tr>
                    </tbody>
                </table>
            `;

            container.innerHTML = tableHTML;
            modal.classList.add('active');
        });

        document.getElementById('closeCompareModal').addEventListener('click', () => {
            document.getElementById('compareModal').classList.remove('active');
        });

        document.getElementById('toggleFiltersBtn').addEventListener('click', () => {
            document.getElementById('asideFilters').classList.toggle('open');
        });

        document.getElementById('evaluationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            renderDevices();
        });

        document.getElementById('deviceSearch').addEventListener('input', renderDevices);
        document.getElementById('brand').addEventListener('change', renderDevices);

        applyI18n();
        renderDevices();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch((err) => console.error('Service Worker Registration Failed:', err));
            });
        }
    </script>
</body>
</html>
