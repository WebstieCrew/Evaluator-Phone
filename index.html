<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluator-Phone - Advanced Mobile Device Evaluator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #090d16;
            --bg-card: rgba(19, 27, 46, 0.75);
            --bg-card-hover: rgba(30, 41, 69, 0.85);
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --accent-secondary: #06b6d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-lg: 18px;
            --radius-md: 12px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
        }

        header {
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 13, 22, 0.85);
        }

        .navbar {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo i {
            color: var(--accent-primary);
            font-size: 1.6rem;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-bar {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-bar input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 0.65rem 1rem 0.65rem 2.6rem;
            border-radius: var(--radius-md);
            color: var(--text-main);
            outline: none;
            width: 260px;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .search-bar input:focus {
            width: 320px;
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px var(--accent-glow);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-bar i {
            position: absolute;
            left: 0.9rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2.5rem 2rem;
            width: 100%;
            flex: 1;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
        }

        .evaluator-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-title span {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control {
            background: rgba(9, 13, 22, 0.7);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.8rem 1rem;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .range-slider {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .range-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .range-slider input[type="range"] {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            accent-color: var(--accent-primary);
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            padding: 0.9rem;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            opacity: 0.95;
            box-shadow: 0 0 25px var(--accent-glow);
            transform: translateY(-2px);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .results-title {
            font-size: 1.35rem;
            font-weight: 700;
        }

        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.5rem;
        }

        .device-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            position: relative;
        }

        .device-card:hover {
            transform: translateY(-6px);
            border-color: rgba(99, 102, 241, 0.4);
            background: var(--bg-card-hover);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        .device-image-wrap {
            width: 100%;
            height: 180px;
            overflow: hidden;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
        }

        .device-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .device-card:hover .device-image-wrap img {
            transform: scale(1.05);
        }

        .device-body {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .device-info h3 {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .device-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        .score-badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--accent-primary);
            color: #818cf8;
            font-weight: 800;
            font-size: 0.95rem;
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-md);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .specs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            margin: 1rem 0;
            font-size: 0.85rem;
            flex: 1;
        }

        .specs-list li {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            padding-bottom: 0.35rem;
        }

        .specs-list li span {
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
        }

        .device-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }

        .price-tag {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--accent-secondary);
        }

        .btn-link {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 0.9rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: var(--transition);
        }

        .btn-link:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
            }
            .search-bar input {
                width: 100%;
            }
            .search-bar input:focus {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="#" class="logo">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>Evaluator-Phone</span>
            </a>
            <div class="nav-actions">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="deviceSearch" placeholder="Search devices...">
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="dashboard-grid">
            <aside class="card">
                <form class="evaluator-form" id="evaluationForm">
                    <div class="form-title">
                        <span><i class="fa-solid fa-sliders"></i> Custom Criteria Weights</span>
                        <span class="status-badge"><i class="fa-solid fa-circle-check"></i> API Live</span>
                    </div>

                    <div class="form-group">
                        <label for="brand">Brand Filter</label>
                        <select id="brand" class="form-control">
                            <option value="all">All Brands</option>
                            <option value="apple">Apple</option>
                            <option value="samsung">Samsung</option>
                            <option value="google">Google</option>
                            <option value="oneplus">OnePlus</option>
                            <option value="xiaomi">Xiaomi</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="price">Max Budget ($)</label>
                        <input type="number" id="price" class="form-control" placeholder="1500" value="1500">
                    </div>

                    <div class="range-slider">
                        <div class="range-header">
                            <span>Camera Priority</span>
                            <span id="cameraVal">40%</span>
                        </div>
                        <input type="range" id="camera" min="0" max="100" value="40">
                    </div>

                    <div class="range-slider">
                        <div class="range-header">
                            <span>Performance Priority</span>
                            <span id="perfVal">35%</span>
                        </div>
                        <input type="range" id="performance" min="0" max="100" value="35">
                    </div>

                    <div class="range-slider">
                        <div class="range-header">
                            <span>Battery & Charging</span>
                            <span id="batteryVal">25%</span>
                        </div>
                        <input type="range" id="battery" min="0" max="100" value="25">
                    </div>

                    <button type="submit" class="btn-primary">
                        <i class="fa-solid fa-calculator"></i> Calculate Scores
                    </button>
                </form>
            </aside>

            <section class="results-container">
                <div class="results-header">
                    <h2 class="results-title">Evaluated Devices</h2>
                    <span id="resultCount" style="color: var(--text-muted); font-size: 0.9rem; font-weight: 600;">Loading real-time devices...</span>
                </div>

                <div class="device-grid" id="deviceGrid">
                </div>
            </section>
        </div>
    </main>

    <script>
        const API_DEVICES = [
            {
                id: "samsung-s25-ultra",
                name: "Galaxy S25 Ultra",
                brand: "samsung",
                price: 1299,
                image: "image_agent_tag_1873985221351286179",
                specs: {
                    processor: "Snapdragon 8 Elite",
                    display: '6.8" Dynamic AMOLED 2X 120Hz',
                    camera: "200MP + 50MP + 50MP + 10MP",
                    battery: "5000 mAh (45W)",
                    ram: "12GB / 16GB"
                },
                rawScores: { camera: 98, performance: 99, battery: 92 }
            },
            {
                id: "iphone-16-pro-max",
                name: "iPhone 16 Pro Max",
                brand: "apple",
                price: 1199,
                image: "image_agent_tag_1873985221351287354",
                specs: {
                    processor: "Apple A18 Pro",
                    display: '6.9" Super Retina XDR OLED',
                    camera: "48MP + 48MP + 12MP 5x",
                    battery: "4685 mAh (45W)",
                    ram: "8GB"
                },
                rawScores: { camera: 97, performance: 98, battery: 96 }
            },
            {
                id: "pixel-9-pro",
                name: "Pixel 9 Pro XL",
                brand: "google",
                price: 1099,
                image: "image_agent_tag_1873985221351285597",
                specs: {
                    processor: "Google Tensor G4",
                    display: '6.8" LTPO OLED 1280 nits',
                    camera: "50MP + 48MP + 48MP 5x",
                    battery: "5060 mAh (37W)",
                    ram: "16GB"
                },
                rawScores: { camera: 99, performance: 88, battery: 90 }
            },
            {
                id: "oneplus-13",
                name: "OnePlus 13",
                brand: "oneplus",
                price: 899,
                image: "image_agent_tag_1873985221351287936",
                specs: {
                    processor: "Snapdragon 8 Elite",
                    display: '6.82" 2K AMOLED 120Hz',
                    camera: "50MP + 50MP + 50MP Hasselblad",
                    battery: "6000 mAh (100W)",
                    ram: "12GB / 16GB / 24GB"
                },
                rawScores: { camera: 92, performance: 99, battery: 100 }
            },
            {
                id: "xiaomi-14-ultra",
                name: "Xiaomi 14 Ultra",
                brand: "xiaomi",
                price: 1299,
                image: "image_agent_tag_1873985221351286179",
                specs: {
                    processor: "Snapdragon 8 Gen 3",
                    display: '6.73" LTPO AMOLED 120Hz',
                    camera: "50MP Quad-Camera Leica",
                    battery: "5000 mAh (90W)",
                    ram: "16GB"
                },
                rawScores: { camera: 99, performance: 95, battery: 91 }
            }
        ];

        const updateSliderVal = (id, targetId) => {
            const input = document.getElementById(id);
            const target = document.getElementById(targetId);
            input.addEventListener('input', (e) => {
                target.textContent = `${e.target.value}%`;
            });
        };

        updateSliderVal('camera', 'cameraVal');
        updateSliderVal('performance', 'perfVal');
        updateSliderVal('battery', 'batteryVal');

        function calculateIndex(device, weights) {
            const totalWeight = weights.camera + weights.performance + weights.battery;
            if (totalWeight === 0) return 0;

            const weightedScore = 
                (device.rawScores.camera * weights.camera) +
                (device.rawScores.performance * weights.performance) +
                (device.rawScores.battery * weights.battery);

            const score = (weightedScore / totalWeight) / 10;
            return score.toFixed(1);
        }

        function renderDevices() {
            const brandFilter = document.getElementById('brand').value;
            const maxPrice = parseFloat(document.getElementById('price').value) || Infinity;
            const searchQuery = document.getElementById('deviceSearch').value.toLowerCase();

            const weights = {
                camera: parseInt(document.getElementById('camera').value),
                performance: parseInt(document.getElementById('performance').value),
                battery: parseInt(document.getElementById('battery').value)
            };

            const filteredDevices = API_DEVICES.filter(device => {
                const matchesBrand = brandFilter === 'all' || device.brand === brandFilter;
                const matchesPrice = device.price <= maxPrice;
                const matchesSearch = device.name.toLowerCase().includes(searchQuery) || device.specs.processor.toLowerCase().includes(searchQuery);
                return matchesBrand && matchesPrice && matchesSearch;
            });

            const evaluatedDevices = filteredDevices.map(device => ({
                ...device,
                calculatedIndex: calculateIndex(device, weights)
            })).sort((a, b) => b.calculatedIndex - a.calculatedIndex);

            const grid = document.getElementById('deviceGrid');
            const resultCount = document.getElementById('resultCount');
            
            resultCount.textContent = `Showing ${evaluatedDevices.length} evaluated items`;
            grid.innerHTML = '';

            evaluatedDevices.forEach(device => {
                const card = document.createElement('div');
                card.className = 'device-card';
                card.innerHTML = `
                    <div class="device-image-wrap">
                        <img src="${device.image}" alt="${device.name}">
                    </div>
                    <div class="device-body">
                        <div class="device-header">
                            <div class="device-info">
                                <h3>${device.name}</h3>
                                <p>${device.brand.toUpperCase()}</p>
                            </div>
                            <div class="score-badge">${device.calculatedIndex}</div>
                        </div>
                        <ul class="specs-list">
                            <li>Processor <span>${device.specs.processor}</span></li>
                            <li>Display <span>${device.specs.display}</span></li>
                            <li>Camera <span>${device.specs.camera}</span></li>
                            <li>Battery <span>${device.specs.battery}</span></li>
                            <li>RAM <span>${device.specs.ram}</span></li>
                        </ul>
                        <div class="device-footer">
                            <span class="price-tag">$${device.price}</span>
                            <button class="btn-link">Analyze <i class="fa-solid fa-arrow-right"></i></button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('evaluationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            renderDevices();
        });

        document.getElementById('deviceSearch').addEventListener('input', renderDevices);
        document.getElementById('brand').addEventListener('change', renderDevices);

        renderDevices();
    </script>
</body>
</html>
